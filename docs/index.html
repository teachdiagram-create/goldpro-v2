<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldPro V2 — داشبورد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoldPro">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
    color: #e8ecf5;
    min-height: 100vh;
    padding: 20px;
    line-height: 1.7;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0; margin-bottom: 20px; }
  h1 {
    font-size: 2.5rem; font-weight: 800;
    background: linear-gradient(135deg, #ffd700, #f5b041, #ffed4e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .subtitle { color: #8892b0; font-size: 0.95rem; }
  .status-bar {
    display: inline-block; padding: 6px 16px;
    background: rgba(0, 255, 100, 0.1);
    color: #4ade80;
    border: 1px solid rgba(74, 222, 128, 0.3);
    border-radius: 999px; font-size: 0.85rem; margin-top: 12px;
  }
  .status-bar.error {
    background: rgba(255, 80, 80, 0.1);
    color: #f87171;
    border-color: rgba(248, 113, 113, 0.3);
  }
  .price-card {
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 215, 0, 0.03));
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.1);
  }
  .price-label {
    font-size: 0.85rem;
    color: #8892b0;
    margin-bottom: 10px;
  }
  .price-value {
    font-size: 2.5rem;
    font-weight: 800;
    color: #ffd700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
    font-family: 'Vazirmatn', sans-serif;
  }
  .live-bar {
    display: flex; justify-content: center; gap: 18px;
    flex-wrap: wrap; padding: 10px 16px;
    background: rgba(74, 222, 128, 0.05);
    border: 1px solid rgba(74, 222, 128, 0.15);
    border-radius: 999px; margin-bottom: 20px;
    font-size: 0.85rem; color: #b8c1d9;
  }
  .live-item { display: flex; align-items: center; gap: 6px; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  #live-clock { color: #ffd700; font-weight: 700; }
  #live-countdown { color: #4ade80; font-weight: 700; min-width: 22px; display: inline-block; text-align: center; }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .stat {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 215, 0, 0.15);
    border-radius: 14px; padding: 18px; text-align: center;
    transition: all 0.3s;
  }
  .stat-value { font-size: 1.8rem; font-weight: 800; color: #ffd700; line-height: 1; margin-bottom: 6px; }
  .stat-value.win { color: #4ade80; }
  .stat-value.loss { color: #f87171; }
  .stat-value.pnl-pos { color: #4ade80; }
  .stat-value.pnl-neg { color: #f87171; }
  .stat-value.small { font-size: 1.3rem; }
  .stat-label { font-size: 0.8rem; color: #8892b0; }
  
  /* آمار مجزای استراتژی‌ها */
  .strategy-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px; margin-bottom: 20px;
  }
  .strat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 15px; text-align: center;
  }
  .strat-card.range { border-top: 4px solid #a78bfa; }
  .strat-card.trend { border-top: 4px solid #38bdf8; }
  .strat-card.correlation { border-top: 4px solid #fbbf24; }
  .strat-card.ichimoku { border-top: 4px solid #f43f5e; } /* رنگ ایچیموکو */
  .strat-title { font-size: 0.9rem; font-weight: 800; margin-bottom: 8px; }
  .strat-wr { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
  .strat-detail { font-size: 0.75rem; color: #8892b0; }
  
  .card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 215, 0, 0.15);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .card h2 { font-size: 1.2rem; color: #ffd700; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 215, 0, 0.15); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
  .chart-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 16px; padding: 20px; }
  .chart-box h3 { font-size: 1rem; color: #b8c1d9; margin-bottom: 16px; text-align: center; }
  .chart-wrap { position: relative; height: 220px; }
  
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 12px 8px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
  th { color: #8892b0; font-weight: 600; font-size: 0.75rem; }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: rgba(255, 215, 0, 0.06); }
  
  .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
  .badge.buy { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
  .badge.sell { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
  .badge.win { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
  .badge.loss { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }
  .badge.open { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); }
  
  /* بج‌های استراتژی‌ها */
  .badge.range { background: rgba(167, 139, 250, 0.15); color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.3); }
  .badge.trend { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
  .badge.correlation { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
  .badge.ichimoku { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); } /* بج ایچیموکو */
  
  .badge.grade-A { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
  .badge.grade-B { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
  .badge.grade-C { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); }
  .badge.grade-D { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }
  
  .empty { text-align: center; padding: 40px 20px; color: #8892b0; font-size: 0.95rem; }
  footer { text-align: center; padding: 30px 0; color: #4a5578; font-size: 0.85rem; }
  .refresh-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3); color: #ffd700; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
  
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: linear-gradient(135deg, #141a2e 0%, #1a1f35 100%); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; position: relative; }
  .modal-close { position: absolute; top: 16px; left: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #e8ecf5; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  .modal-header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 215, 0, 0.15); }
  .modal-section { margin-bottom: 20px; }
  .modal-section h4 { font-size: 0.85rem; color: #8892b0; text-transform: uppercase; margin-bottom: 12px; }
  .result-box { padding: 20px; border-radius: 12px; text-align: center; font-size: 1.4rem; font-weight: 800; margin-bottom: 16px; }
  .result-box.win { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 2px solid rgba(74, 222, 128, 0.4); }
  .result-box.loss { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 2px solid rgba(248, 113, 113, 0.4); }
  .result-box.open { background: rgba(255, 215, 0, 0.1); color: #ffd700; border: 2px solid rgba(255, 215, 0, 0.3); }
  
  .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .price-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 14px 10px; text-align: center; }
  .price-item .label { font-size: 0.75rem; color: #8892b0; margin-bottom: 6px; }
  .price-item .value { font-size: 1.1rem; font-weight: 800; }
  
  #button-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 9999; padding: 8px; background: rgba(10, 14, 26, 0.85); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 999px; }
  #notify-btn { background: linear-gradient(135deg, #ffd700, #f5b041); color: #0a0e1a; border: none; padding: 8px 14px; border-radius: 999px; font-family: Vazirmatn, sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
  #test-sound-btn { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); padding: 8px 14px; border-radius: 999px; font-family: Vazirmatn, sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
  
  @media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .stat-value { font-size: 1.4rem; }
    .price-value { font-size: 2rem; }
    th, td { padding: 10px 5px; font-size: 0.75rem; }
    .hide-mobile { display: none; }
    .price-grid { grid-template-columns: 1fr; }
    #button-bar { bottom: 15px; }
    #notify-btn, #test-sound-btn { padding: 7px 11px; font-size: 0.72rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🥇 GoldPro V2</h1>
    <div class="subtitle">داشبورد سیگنال‌های معاملاتی XAU/USD</div>
    <div id="status" class="status-bar">⏳ در حال بارگذاری...</div>
  </header>

  <div class="price-card">
    <div class="price-label">💰 قیمت لحظه‌ای طلا (XAU/USD)</div>
    <div class="price-value" id="live-price">—</div>
  </div>

  <div class="live-bar">
    <div class="live-item"><span class="live-dot"></span><span>زنده</span></div>
    <div class="live-item">🕐 <span id="live-clock">--:--:--</span></div>
    <div class="live-item">🔄 بروزرسانی در <span id="live-countdown">60</span> ثانیه</div>
  </div>

  <!-- آمار مجزای استراتژی‌ها -->
  <div class="strategy-stats" id="strategy-stats"></div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="total">-</div>
      <div class="stat-label">کل سیگنال‌ها</div>
    </div>
    <div class="stat">
      <div class="stat-value win" id="wins">-</div>
      <div class="stat-label">🏆 برد (WIN)</div>
    </div>
    <div class="stat">
      <div class="stat-value loss" id="losses">-</div>
      <div class="stat-label">❌ باخت (LOSS)</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="open-count">-</div>
      <div class="stat-label">⏳ در جریان</div>
    </div>
  </div>

  <div class="card">
    <h2 style="display:flex; justify-content:space-between; align-items:center;">
      📋 سیگنال‌های اخیر
      <button class="refresh-btn" onclick="loadData()">🔄 بروزرسانی</button>
    </h2>
    <div id="table-wrap">
      <div class="empty">⏳ در حال بارگذاری...</div>
    </div>
  </div>

  <footer>GoldPro V2 • به‌روزرسانی خودکار هر ۶۰ ثانیه</footer>
</div>

<div id="button-bar">
  <button id="notify-btn" onclick="initNotification()">🔔 فعال‌سازی نوتیفیکیشن</button>
  <button id="test-sound-btn" onclick="testSoundAndVibrate()">🔊 تست صدا</button>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>
<script>
const GIST_ID = "da4184ca28cfa99438719f3e331c08b3";
const GIST_API = "https://api.github.com/gists/" + GIST_ID;
let currentHistory = [];
let countdown = 60;
let lastSeenSentAt = localStorage.getItem("last_seen_sent_at") || "";

function formatTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "Z");
  return d.toLocaleString("fa-IR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function setStatus(text, isError = false) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status-bar" + (isError ? " error" : "");
}

function round2(n) { return Math.round(n * 100) / 100; }
function getResultBadge(r) {
  if (r === "WIN") return '<span class="badge win">✅ WIN</span>';
  if (r === "LOSS") return '<span class="badge loss">❌ LOSS</span>';
  return '<span class="badge open">⏳ OPEN</span>';
}

async function loadData() {
  setStatus("⏳ در حال بارگذاری...");
  try {
    const r = await fetch(GIST_API + "?t=" + Date.now());
    const data = await r.json();
    const file = data.files["goldpro-state.json"] || Object.values(data.files)[0];
    const state = JSON.parse(file.content || "{}");
    
    currentHistory = state.history || [];
    if (state.current_price) {
      document.getElementById("live-price").textContent = round2(state.current_price).toLocaleString("fa-IR");
    }

    renderStats(currentHistory);
    renderTable(currentHistory);
    checkForNewSignals(currentHistory);
    
    setStatus(`✅ متصل — ${currentHistory.length} سیگنال`);
    countdown = 60;
  } catch (e) {
    setStatus("❌ خطا: " + e.message, true);
  }
}

function renderStats(history) {
  const total = history.length;
  const wins = history.filter(t => t.result === "WIN").length;
  const losses = history.filter(t => t.result === "LOSS").length;
  const opens = history.filter(t => !t.result).length;
  const closed = wins + losses;
  const winRate = closed > 0 ? round2(wins / closed * 100) : 0;
  const pnl = round2(history.reduce((s, t) => s + (t.pnl || 0), 0));

  document.getElementById("total").textContent = total;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
  document.getElementById("open-count").textContent = opens;
  
  if (document.getElementById("win-rate")) {
    document.getElementById("win-rate").textContent = winRate + "%";
    document.getElementById("total-pnl").textContent = (pnl >= 0 ? "+" : "") + pnl;
    document.getElementById("total-pnl").className = "stat-value small " + (pnl >= 0 ? "pnl-pos" : "pnl-neg");
  }

  // آمار مجزای هر استراتژی
  const strategies = ["RANGE", "TREND", "CORRELATION", "ICHIMOKU"];
  const names = { RANGE: "🔄 Range", TREND: "📈 Trend", CORRELATION: "📊 Correlation", ICHIMOKU: "☁️ Ichimoku" };
  const classes = { RANGE: "range", TREND: "trend", CORRELATION: "correlation", ICHIMOKU: "ichimoku" };
  let stratHtml = "";

  strategies.forEach(strat => {
    const trades = history.filter(t => (t.strategy || "RANGE") === strat);
    if (trades.length === 0) return;
    
    const sWins = trades.filter(t => t.result === "WIN").length;
    const sLosses = trades.filter(t => t.result === "LOSS").length;
    const sOpens = trades.filter(t => !t.result).length;
    const sClosed = sWins + sLosses;
    const sWr = sClosed > 0 ? round2(sWins / sClosed * 100) : 0;
    const sPnl = round2(trades.reduce((sum, t) => sum + (t.pnl || 0), 0));
    
    const wrColor = sWr >= 50 ? "color:#4ade80;" : "color:#f87171;";
    const pnlColor = sPnl >= 0 ? "color:#4ade80;" : "color:#f87171;";
    
    stratHtml += `
      <div class="strat-card ${classes[strat]}">
        <div class="strat-title">${names[strat]}</div>
        <div class="strat-wr" style="${wrColor}">${sWr}%</div>
        <div class="strat-detail">
          ${sWins}W / ${sLosses}L | در جریان: ${sOpens}<br>
          <span style="${pnlColor}">PnL: ${sPnl >= 0 ? '+' : ''}${sPnl}</span>
        </div>
      </div>
    `;
  });
  document.getElementById("strategy-stats").innerHTML = stratHtml;
}

function renderTable(history) {
  if (!history.length) {
    document.getElementById("table-wrap").innerHTML = '<div class="empty">📭 هنوز سیگنالی ثبت نشده</div>';
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>زمان</th><th>استراتژی</th><th>نوع</th>
      <th>کیفیت</th><th>نتیجه</th><th class="hide-mobile">ورود</th>
    </tr></thead><tbody>`;

  history.forEach((t, i) => {
    const strategy = t.strategy || "RANGE";
    
    // تعریف بج برای هر استراتژی
    let strategyHtml = '<span class="badge range">🔄 Range</span>';
    if (strategy === "TREND") strategyHtml = '<span class="badge trend">📈 Trend</span>';
    if (strategy === "CORRELATION") strategyHtml = '<span class="badge correlation">📊 Correlation</span>';
    if (strategy === "ICHIMOKU") strategyHtml = '<span class="badge ichimoku">☁️ Ichimoku</span>';

    let gradeHtml = "—";
    if (t.quality && t.quality.grade) {
      const g = t.quality.grade;
      gradeHtml = `<span class="badge grade-${g}">${t.quality.score} ${g}</span>`;
    }

    html += `
      <tr onclick="showDetails(${i})">
        <td>${formatTime(t.sent_at)}</td>
        <td>${strategyHtml}</td>
        <td><span class="badge ${t.side === 'BUY' ? 'buy' : 'sell'}">${t.side}</span></td>
        <td>${gradeHtml}</td>
        <td>${getResultBadge(t.result)}</td>
        <td class="hide-mobile">${t.entry || '—'}</td>
      </tr>`;
  });
  document.getElementById("table-wrap").innerHTML = html + "</tbody></table>";
}

function showDetails(index) {
  const t = currentHistory[index];
  if (!t) return;

  const strategy = t.strategy || "RANGE";
  let strategyLabel = "🔄 Range (RSI)";
  if (strategy === "TREND") strategyLabel = "📈 Trend (EMA+MACD)";
  if (strategy === "CORRELATION") strategyLabel = "📊 Correlation (DXY)";
  if (strategy === "ICHIMOKU") strategyLabel = "☁️ Ichimoku";
  
  let qualityHtml = "";
  if (t.quality) {
    const q = t.quality;
    const gradeEmoji = {A: "🏆", B: "✅", C: "⚠️", D: "🚫"}[q.grade] || "❔";
    qualityHtml = `
      <div class="modal-section">
        <h4>⭐ کیفیت سیگنال</h4>
        <div class="result-box ${q.grade === 'A' || q.grade === 'B' ? 'win' : 'open'}" style="font-size: 1.1rem; padding: 12px;">
          ${gradeEmoji} امتیاز: ${q.score}/100 — گرید: ${q.grade}
        </div>
      </div>
    `;
  }

  const rr = t.rr ? ` (R:R 1:${t.rr})` : "";
  const pricesHtml = `
    <div class="modal-section">
      <h4>💰 قیمت‌ها${rr}</h4>
      <div class="price-grid">
        <div class="price-item entry"><div class="label">ورود</div><div class="value">${t.entry || '—'}</div></div>
        <div class="price-item sl"><div class="label">حد ضرر</div><div class="value">${t.sl || '—'}</div></div>
        <div class="price-item tp"><div class="label">حد سود</div><div class="value">${t.tp || '—'}</div></div>
        ${t.exit_price ? `<div class="price-item exit"><div class="label">خروج</div><div class="value">${t.exit_price}</div></div>` : ''}
      </div>
    </div>
  `;

  document.getElementById("modal-content").innerHTML = `
    <div class="modal-header">
      <div class="badge ${t.side === 'BUY' ? 'buy' : 'sell'}" style="font-size: 1.2rem; margin-bottom: 8px;">
        ${t.side} — ${t.timeframe || ''}
      </div>
      <div class="badge ${strategy.toLowerCase()}" style="margin-bottom: 12px;">
        ${strategyLabel}
      </div>
      <h3>${t.result ? getResultBadge(t.result) : '⏳ در جریان'}</h3>
      <div class="time">${formatTime(t.sent_at)}</div>
    </div>
    ${t.result ? `<div class="modal-section"><div class="result-box ${t.result.toLowerCase()}">${t.result === 'WIN' ? '🏆' : '❌'} ${t.result} ${t.pnl ? `(${t.pnl > 0 ? '+' : ''}${t.pnl})` : ''}</div></div>` : ''}
    ${qualityHtml}
    ${pricesHtml}
    <div class="modal-section">
      <h4>📝 دلیل سیگنال</h4>
      <div style="color: #8892b0; font-size: 0.9rem; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px;">
        ${t.reason || '—'}
      </div>
    </div>
  `;

  document.getElementById("modal").classList.add("active");
}

function closeModal(e) {
  if (e.target.id === "modal" || e.target.className === "modal-close") document.getElementById("modal").classList.remove("active");
}

function checkForNewSignals(history) {
  if (!history.length) return;
  const latest = history[0];
  if (latest.sent_at && latest.sent_at !== lastSeenSentAt) {
    if (lastSeenSentAt) {
      if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      if (Notification.permission === "granted") {
        new Notification(`سیگنال جدید: ${latest.side}`, { body: `${latest.strategy} در ${latest.entry}` });
      }
    }
    lastSeenSentAt = latest.sent_at;
    localStorage.setItem("last_seen_sent_at", lastSeenSentAt);
  }
}

function initNotification() {
  Notification.requestPermission().then(perm => {
    if (perm === "granted") document.getElementById("notify-btn").textContent = "🔔 نوتیفیکیشن فعال";
  });
}
function testSoundAndVibrate() { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }

function tick() {
  document.getElementById("live-clock").textContent = new Date().toLocaleTimeString("fa-IR");
  countdown--;
  document.getElementById("live-countdown").textContent = countdown;
  if (countdown <= 0) { countdown = 60; loadData(); }
}

setInterval(tick, 1000);
loadData();
</script>
</body>
</html>
