name: Test Strategy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug — show config.py content
        run: |
          echo "===== CURRENT COMMIT ====="
          git log -1 --oneline
          echo ""
          echo "===== grep TIMEFRAMES ====="
          grep -n "TIMEFRAMES" src/config.py || echo "NOT FOUND!"
          echo ""
          echo "===== files in src/ ====="
          ls -la src/
          echo ""
          echo "===== any __pycache__? ====="
          find . -name "__pycache__" -type d

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Test import
        run: |
          python -c "
          import src.config as cfg
          print('File path:', cfg.__file__)
          print('Has TIMEFRAMES:', hasattr(cfg, 'TIMEFRAMES'))
          print('TIMEFRAMES value:', getattr(cfg, 'TIMEFRAMES', 'MISSING'))
          print('All attributes:', [x for x in dir(cfg) if not x.startswith('_')])
          "

      - name: Run strategy diagnostic
        run: python test_strategy.py